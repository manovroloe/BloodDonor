<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#b91c1c">
    <title>BloodCare Admin | Audit Log</title><link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <script>(function(){try{var t=localStorage.getItem('bloodcare-theme');document.documentElement.dataset.theme=t||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}catch(e){}})();</script><link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/theme.css">
    <script src="js/api.js"></script><script defer src="js/ui.js"></script><script type="module" src="js/app.js"></script>
</head>

<body data-staff="1" data-page="admin-audit" data-admin="1">
    <div class="staff-layout">
        <aside class="staff-side" id="managementSidebar">
            <div class="staff-brand"><img class="brand-logo-icon staff-brand-icon" src="images/favicon.svg" alt="" aria-hidden="true"><span>BloodCare</span></div>
            <div class="empty dark-empty">Loading menu…</div>
        </aside>
        <main class="staff-main">
            <div class="staff-head">
                <div><small>ADMINISTRATION</small>
                    <h1>Activity & Audit Log</h1>
                    <p class="muted-text">System changes are recorded automatically. Audit entries are read-only from
                        the portal.</p>
                </div>
            </div>
            <div class="panel">
                <div class="toolbar"><input id="auditSearch" placeholder="Search action, entity, user…"><select
                        id="auditEntityFilter">
                        <option value="">All entities</option>
                        <option>donors</option>
                        <option>blood_requests</option>
                        <option>appointments</option>
                        <option>donations</option>
                        <option>blood_units</option>
                        <option>inventory_transactions</option>
                        <option>announcements</option>
                        <option>events</option>
                        <option>facilities</option>
                        <option>staff_profiles</option>
                        <option>system_settings</option>
                    </select></div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Action</th>
                                <th>Entity</th>
                                <th>Record</th>
                                <th>Performed By</th>
                                <th>Details</th>
                            </tr>
                        </thead>
                        <tbody id="auditBody"></tbody>
                    </table>
                </div>
                <div id="auditPagination" class="pagination-bar"></div>
            </div>
        </main>
    </div>
    
</body>

</html>
